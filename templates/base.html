<!doctype html>
<html lang="en">
   <head>
       <meta charset="UTF-8">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <link rel="stylesheet" href="../static/css/bootstrap.css">
        <link rel="stylesheet" href="../static/css/style.css">
        <script src="../static/js/bootstrap.js"></script>
        <script src="../static/js/java.js"></script>
        {% block title %}{% endblock %}
   </head>
  <body>
     <!-- Fixed navbar -->
    <nav class="navbar navbar-inverse ">
      <div class="container-fluid">
        <div class="navbar-header">
          <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
            <span class="sr-only">Toggle navigation</span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </button>
          <a class="navbar-brand" href="/">Ustacky</a>
        </div>
        <div id="navbar" class="collapse navbar-collapse">
          <ul class="nav navbar-nav">
            <li {% block home_active %}{% endblock %}><a href="/">Home</a></li>
          </ul>
          <ul class="nav navbar-nav navbar-right">
            <li {% block dash_active %}{% endblock %}><a href="/information">Get started</a></li>
          </ul>
        </div><!--/.nav-collapse -->
      </div>
    </nav>
    {% block content %}{% endblock %}


    <footer class="footer">
      <div class="container">
        <p class="text-muted">All rights reserved &copyUstacky 2026.</p>
      </div>
    </footer>
  </body>
</html>
